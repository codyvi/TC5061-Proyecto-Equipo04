name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Ejecutar pruebas
        run: python -m pytest -q

  imagen:
    name: Construir imagen y validar compose
    runs-on: ubuntu-latest
    needs: pruebas
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml
        run: docker compose config -q
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen de la API (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: false
          load: true
          tags: mibici-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verificar que la imagen arranca
        run: docker run --rm --entrypoint python mibici-api:ci -c "import app.main; print('import ok')"
      - name: Iniciar sesión en GHCR (solo push a main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar imagen en GHCR (solo push a main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mibici-api:latest
            ghcr.io/${{ github.repository_owner }}/mibici-api:${{ github.sha }}
          cache-from: type=gha

  despliegue:
    name: Despliegue de prueba (compose)
    runs-on: ubuntu-latest
    needs: pruebas
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Levantar el sistema con Docker Compose
        run: docker compose up -d --build
      - name: Esperar a que la API responda y verificar /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health -o salud.json; then
              echo "API arriba:"; cat salud.json; echo
              grep -q '"estado"' salud.json && exit 0
            fi
            sleep 5
          done
          echo "La API no respondió a tiempo" >&2
          exit 1
      - name: Estado y logs de los servicios
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail=50
      - name: Detener y limpiar
        if: always()
        run: docker compose down -v

  resumen:
    name: Resumen y notificación
    runs-on: ubuntu-latest
    needs: [pruebas, imagen, despliegue]
    if: always()
    steps:
      - name: Publicar resumen en la ejecución
        run: |
          {
            echo "## Resultado del CI"
            echo ""
            echo "| Etapa | Resultado |"
            echo "| --- | --- |"
            echo "| Pruebas (pytest) | ${{ needs.pruebas.result }} |"
            echo "| Imagen y compose | ${{ needs.imagen.result }} |"
            echo "| Despliegue de prueba | ${{ needs.despliegue.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fallar (y notificar por correo de GitHub) si alguna etapa falló
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::El pipeline de CI falló; revisa las etapas del resumen."
          exit 1
