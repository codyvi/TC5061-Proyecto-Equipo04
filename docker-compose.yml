version: '3.8'

services:
  mlflow-server:
    image: python:3.12-slim
    container_name: mibici-mlflow-server
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow/mlflow.db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    command: >
      bash -c "pip install mlflow==3.17.2 &&
               mlflow server --host 0.0.0.0 --port 5000 
               --backend-store-uri sqlite:///mlflow/mlflow.db 
               --allowed-hosts '*' 
               --default-artifact-root /mlflow/artifacts"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - mibici-net

  api:
    build:
      context: .
      dockerfile: Containerfile
    container_name: mibici-api-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - MODELO_ALIAS=${MODELO_ALIAS:-champion}
      # Registro de predicciones (apagado por defecto): REGISTRO_PREDICCIONES=1 docker compose up
      - REGISTRO_PREDICCIONES=${REGISTRO_PREDICCIONES:-0}
      - REGISTRO_PREDICCIONES_RUTA=/app/data/interim/predicciones_api.jsonl
    volumes:
      # El JSONL queda en data/interim/ del equipo para correr el drift sobre el tráfico real
      - ./data/interim:/app/data/interim
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    depends_on:
      mlflow-server:
        condition: service_healthy
    networks:
      - mibici-net

volumes:
  mlflow_data:

networks:
  mibici-net:
    driver: bridge