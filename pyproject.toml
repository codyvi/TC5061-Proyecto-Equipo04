[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mibici_mlops_module"
version = "0.0.1"
description = "Proyecto MiBici - Predicci\u00f3n de demanda, clasificaci\u00f3n de riesgos y clustering de estaciones con MLflow."
authors = [
  { name = "Equipo04" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.12"


[tool.ruff]
line-length = 99
src = ["mibici_mlops_module"]
include = ["pyproject.toml", "mibici_mlops_module/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mibici_mlops_module"]
force-sort-within-sections = true


[tool.bandit]
# B603: `utils.info_git` ejecuta `git` con la ruta completa y argumentos fijos definidos en el
# código, sin shell ni entrada del usuario.
skips = ["B603"]
